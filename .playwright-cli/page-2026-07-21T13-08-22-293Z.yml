      - generic [ref=e36]:
        - generic [ref=e37]:
          - region [ref=e38]:
            - heading "I. Career, the ultimate dream" [level=2] [ref=e39]
            - paragraph [ref=e40]: Someday I would like to find a job that perfectly combines state-of-the-art AI, robotics, and design. I love tech and pure, hardcore science, but design is a core part of who I am, and it cannot remain just a side aspect of my life. Studying STEM is demanding and the path to becoming an engineer is not easy, but the opportunities it opens up are incredible.
          - region [ref=e41]:
            - heading "II. Side Quests" [level=2] [ref=e42]
            - paragraph [ref=e43]: Someday I would like to enter Silicon Valley's tech world and really grasp what they are up to, from the inside.
            - paragraph [ref=e44]: Someday I'll create a small yet sophisticated audio setup at home to properly listen to music. I'm getting a bit tired of the mid-tier headsets and portable speakers I've owned all my life. I really need high-quality audio in my life, and I want to discover what music actually is.
        - region [ref=e45]:
          - heading "III. Learning new skills" [level=2] [ref=e46]
          - paragraph [ref=e47]: Someday I will be a Graphic Designer. I have always loved design and art, and I want to be able to create beautiful things, with more freedom than user interfaces allow. I'm sure that my experience in web design could be a great foundation for that. I just need to learn to use the right tools.
          - paragraph [ref=e48]: I also want to learn proper photography. I'm taking all my pictures with my iPhone 15 Pro, which has an amazing camera system, but I want to learn how to use a real camera and understand the fundamentals of photography.
          - paragraph [ref=e49]: I've been wanting to learn more about Machine Learning. Many free courses are available online, and I want to explore them. Experimenting with this in python seems like a good and pretty fun start.
          - paragraph [ref=e50]: And finally, let's speak about language. I want to be able to speak German correctly. I learned German in school for many years, but I was never really good at it. It's been two years since I last studied it, and I want to get back into it properly.
