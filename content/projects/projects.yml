page:
  categories: [Web Design, Branding, Graphic Design]
  intro: Featured projects & experiments, curated from 3 years of work. I mostly do web design but I also like to play around with graphic design work.
  playgroundIntro: Everything below are small projects and experiments. They do not have any associated case studies and are the result of me playing around. (In other words, this is the fun stuff!)

# Featured projects always link to /projects/<slug>/.
# Their order here is their order on the page.
# Image paths are relative to content/projects/; assets/projects/ is generated.
featured:
  - slug: sweetgreen-nicolandria
    title: "Sweetgreen: Nicolandria"
    description: Photography
    caseStudy:
      year: "2025"
      description: "An editorial campaign for Sweetgreen's Nicolandria, bringing cinematic character, warm light and saturated food styling into one playful visual world."
      note: "The series moves between portraiture, tactile product detail and still-life photography, keeping every frame bold, direct and recognisable."
    images:
      - file: featured/sweetgreen-01.webp
        alt: Editorial photograph for Sweetgreen's Nicolandria project.
      - file: featured/sweetgreen-02.webp
        alt: Close-up campaign image from the Sweetgreen Nicolandria project.
        wide: true
      - file: featured/sweetgreen-03.webp
        alt: Sweetgreen pickle ketchup surrounded by tomatoes.
        main: true

  - slug: hotel-wren
    title: Hotel Wren
    description: Web
    caseStudy:
      year: "2025"
      description: "A digital direction for Hotel Wren, translating the property's intimate interiors and coastal atmosphere into a quiet, image-led web experience."
      note: "Restrained navigation, warm editorial photography and measured motion let the place lead the story."
    images:
      - file: featured/hotel-wren-01.gif
        alt: Animated Hotel Wren website presentation.
        wide: true
        dark: true
        framed: true
      - file: featured/hotel-wren-02.webp
        alt: The Green Room entrance for Hotel Wren.
        main: true
      - file: featured/hotel-wren-03.webp
        alt: Editorial beach portrait from the Hotel Wren project.

  - slug: flamingo-estate
    title: Flamingo Estate
    description: Photography, Motion
    caseStudy:
      year: "2025"
      description: "A photography and motion study for Flamingo Estate, focused on the ritual, texture and lived-in atmosphere surrounding the brand."
      note: "Still life, interior photography and short-form motion are sequenced as one warm, tactile campaign system."
      sections:
