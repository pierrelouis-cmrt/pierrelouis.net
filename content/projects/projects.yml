page:
  categories: [Web Design, Branding, Graphic Design]
  intro: Featured projects & experiments, curated from 3 years of work. I mostly do web design but I also like to play around with graphic design work.
  playgroundIntro: Everything below are small projects and experiments. They do not have any associated case studies and are the result of me playing around. (In other words, this is the fun stuff!)

