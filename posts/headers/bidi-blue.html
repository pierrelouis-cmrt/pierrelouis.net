<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Blue atmospheric article header</title>
    <style>
      :root {
        --backdrop-primary: #5661f5;
        --backdrop-secondary: #788ffa;
        --backdrop-mist: #d9e8ff;
        --backdrop-surface: #ffffff;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--backdrop-surface);
      }

      .backdrop {
        position: relative;
        width: 100%;
        height: 100%;
        contain: strict;
        isolation: isolate;
        overflow: hidden;
        background: transparent;
      }

      .backdrop__fallback,
      .backdrop__canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .backdrop__fallback {
        background: linear-gradient(
          180deg,
          #606bf6 0%,
          #8b9ffc 28%,
          #c1cbfd 48%,
          #f8fbff 66%,
          #ffffff 80%
        );
        background: linear-gradient(
          180deg,
          color-mix(
              in srgb,
              var(--backdrop-primary) 94%,
              var(--backdrop-surface)
            )
            0%,
          color-mix(
              in srgb,
              var(--backdrop-secondary) 86%,
              var(--backdrop-surface)
            )
            28%,
          color-mix(
              in srgb,
              var(--backdrop-secondary) 46%,
              var(--backdrop-surface)
            )
            48%,
          color-mix(
              in srgb,
              var(--backdrop-mist) 18%,
              var(--backdrop-surface)
            )
            66%,
          var(--backdrop-surface) 80%
        );
      }

      .backdrop__canvas {
        opacity: 0;
        transition: opacity 700ms cubic-bezier(0.45, 0.05, 0.55, 0.95);
      }

      .backdrop__canvas.is-ready {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        .backdrop__canvas {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <div class="backdrop__fallback"></div>
      <canvas class="backdrop__canvas"></canvas>
    </div>

    <script>
      (() => {
        const canvas = document.querySelector(".backdrop__canvas");
        const gl = canvas.getContext("webgl", {
          alpha: false,
          antialias: false,
          depth: false,
          powerPreference: "low-power",
          preserveDrawingBuffer: false,
          stencil: false,
        });

        if (!gl) {
          return;
        }

        const vertexSource = `
          attribute vec2 a_position;

          void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
          }
        `;

        const fragmentSource = `
          precision highp float;

          uniform vec2 u_resolution;
          uniform vec2 u_pointer;
          uniform float u_time;

          const vec3 PRIMARY = vec3(0.3373, 0.3804, 0.9608);
          const vec3 SECONDARY = vec3(0.4706, 0.5608, 0.9804);
          const vec3 MIST = vec3(0.8510, 0.9098, 1.0000);
          const vec3 SURFACE = vec3(1.0);

          float hash(vec2 point) {
            return fract(
              sin(dot(point, vec2(127.1, 311.7))) * 43758.5453123
            );
          }

          float noise(vec2 point) {
            vec2 cell = floor(point);
            vec2 local = fract(point);
            local = local * local * (3.0 - 2.0 * local);

            return mix(
              mix(hash(cell), hash(cell + vec2(1.0, 0.0)), local.x),
              mix(
                hash(cell + vec2(0.0, 1.0)),
                hash(cell + vec2(1.0, 1.0)),
                local.x
              ),
              local.y
            );
          }

          float fbm(vec2 point) {
            float value = 0.0;
            float amplitude = 0.5;

            for (int octave = 0; octave < 4; octave++) {
              value += amplitude * noise(point);
              point = mat2(1.6, 1.2, -1.2, 1.6) * point + 0.17;
              amplitude *= 0.5;
            }

            return value;
          }

          vec3 verticalPalette(float y) {
            vec3 color = mix(PRIMARY, SECONDARY, smoothstep(0.0, 0.28, y));
            color = mix(
              color,
              mix(SECONDARY, MIST, 0.56),
              smoothstep(0.28, 0.54, y)
            );
            color = mix(color, SURFACE, smoothstep(0.46, 0.82, y));
            return color;
          }

          void main() {
            vec2 uv = gl_FragCoord.xy / u_resolution.xy;
            uv.y = 1.0 - uv.y;

            float aspect = u_resolution.x / max(u_resolution.y, 1.0);
            float time = u_time * 0.3;
            vec2 pointer = (u_pointer - 0.5) * vec2(0.055, 0.035);
            vec2 field = vec2(uv.x * aspect, uv.y * 1.34);

            float broad = fbm(
              field * 1.08 +
              vec2(time * 0.022, -time * 0.016) +
              pointer
            );
            float detail = fbm(
              field * 2.15 +
              vec2(-time * 0.014, time * 0.019) -
              pointer * 0.55 +
              broad * 0.32
            );
            float atmosphere = broad * 0.66 + detail * 0.34;

            vec3 color = verticalPalette(uv.y);
            float upperField = 1.0 - smoothstep(0.08, 0.66, uv.y);
            color = mix(
              color,
              mix(PRIMARY * 0.83, SECONDARY * 1.06, atmosphere),
              upperField * 0.24
            );

            float leftFold =
              1.0 -
              smoothstep(
                0.0,
                0.21,
                abs((uv.x - 0.30) + (uv.y - 0.05) * 0.42)
              );
            leftFold *= 1.0 - smoothstep(0.04, 0.42, uv.y);

            float rightFold =
              1.0 -
              smoothstep(
                0.0,
                0.34,
                abs((uv.x - 0.72) - (uv.y - 0.03) * 0.48)
              );
            rightFold *= 1.0 - smoothstep(0.02, 0.48, uv.y);

            color = mix(color, PRIMARY * 0.78, leftFold * 0.12);
            color = mix(color, MIST, rightFold * 0.10);

            float light = exp(
              -8.0 *
              length(
                vec2(
                  (uv.x - 0.55) * 0.72,
                  (uv.y - 0.11) * 1.58
                )
              )
            );
            color = mix(color, MIST, light * 0.13 * upperField);

            float mistLine =
              smoothstep(0.23, 0.74, uv.y) +
              (atmosphere - 0.5) * 0.075 * upperField;
            color = mix(color, SURFACE, smoothstep(0.48, 0.92, mistLine));
            color = mix(color, SURFACE, smoothstep(0.69, 0.82, uv.y));

            float grain = hash(gl_FragCoord.xy + u_time) - 0.5;
            color += grain * 0.006 * upperField;

            gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
          }
        `;

        const compileShader = (type, source) => {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);

          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            gl.deleteShader(shader);
            return null;
          }

          return shader;
        };

        const vertexShader = compileShader(gl.VERTEX_SHADER, vertexSource);
        const fragmentShader = compileShader(
          gl.FRAGMENT_SHADER,
          fragmentSource,
        );

        if (!vertexShader || !fragmentShader) {
          return;
        }

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          return;
        }

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW,
        );

        const position = gl.getAttribLocation(program, "a_position");
        const resolution = gl.getUniformLocation(program, "u_resolution");
        const pointerUniform = gl.getUniformLocation(program, "u_pointer");
        const timeUniform = gl.getUniformLocation(program, "u_time");
        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        );
        const pointer = { x: 0.5, y: 0.5 };
        const pointerTarget = { x: 0.5, y: 0.5 };
        let frame = 0;
        let start = performance.now();

        gl.useProgram(program);
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

        const resize = () => {
          const ratio = Math.min(window.devicePixelRatio || 1, 1.75);
          const width = Math.max(1, Math.round(canvas.clientWidth * ratio));
          const height = Math.max(1, Math.round(canvas.clientHeight * ratio));

          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            gl.viewport(0, 0, width, height);
          }
        };

        const render = (now) => {
          resize();
          pointer.x += (pointerTarget.x - pointer.x) * 0.035;
          pointer.y += (pointerTarget.y - pointer.y) * 0.035;

          gl.uniform2f(resolution, canvas.width, canvas.height);
          gl.uniform2f(pointerUniform, pointer.x, pointer.y);
          gl.uniform1f(timeUniform, (now - start) / 1000);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          if (!canvas.classList.contains("is-ready")) {
            canvas.classList.add("is-ready");
          }

          if (!reducedMotion.matches && !document.hidden) {
            frame = requestAnimationFrame(render);
          }
        };

        window.addEventListener(
          "pointermove",
          (event) => {
            pointerTarget.x = event.clientX / Math.max(window.innerWidth, 1);
            pointerTarget.y = event.clientY / Math.max(window.innerHeight, 1);
          },
          { passive: true },
        );

        window.addEventListener(
          "pointerleave",
          () => {
            pointerTarget.x = 0.5;
            pointerTarget.y = 0.5;
          },
          { passive: true },
        );

        document.addEventListener("visibilitychange", () => {
          cancelAnimationFrame(frame);

          if (!document.hidden) {
            start = performance.now();
            frame = requestAnimationFrame(render);
          }
        });

        reducedMotion.addEventListener("change", () => {
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(render);
        });

        frame = requestAnimationFrame(render);
      })();
    </script>
  </body>
</html>
