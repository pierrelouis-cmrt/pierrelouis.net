name: Build and publish site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deployment
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install ImageMagick
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

          # Ubuntu may package ImageMagick 6 as `convert`; the build expects the
          # ImageMagick 7-compatible `magick` command name.
          if ! command -v magick >/dev/null 2>&1; then
            sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          fi

          magick -version

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -s dist/index.html
          touch dist/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          full_commit_message: Deploy ${{ github.sha }}
