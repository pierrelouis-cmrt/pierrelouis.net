name: Build and publish site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deployment
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployable files
        shell: bash
        run: |
          git clone --filter=blob:none --sparse --no-checkout --depth=1 \
            --branch "${GITHUB_REF_NAME}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git sparse-checkout set \
            .github about api assets colophon favicon imprint links lists \
            now photos posts projects scripts someday tests
          git checkout --detach "${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Test
        run: npm test

      - name: Assemble production site
        run: npm run build:deploy

      - name: Verify build output
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/.htaccess
          grep -Eq 'AddType[[:space:]]+video/webm[[:space:]]+\.webm' dist/.htaccess
          touch dist/.nojekyll

      - name: Publish dist branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dist
          publish_dir: ./dist
          force_orphan: true
          full_commit_message: Deploy ${{ github.sha }}
